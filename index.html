function plansPage(){return `<div class="card" style="margin-bottom:22px"><div class="card-title"><h2>一周安排</h2><small>点击日期设置当天计划 · 预设计划可自由调整</small></div><div class="week">${['日','一','二','三','四','五','六'].map((x,i)=>`<button class="day" data-schedule="${i}"><small>周${x}</small><b style="font-size:11px;margin:12px 0">${esc(typeof phaseScheduleName==='function'?phaseScheduleName(state.schedule[i]):state.plans.find(p=>p.id===state.schedule[i])?.name||'休息日')}</b><span class="dot" style="opacity:${state.schedule[i]?1:.1}"></span></button>`).join('')}</div></div><div class="card-title"><h2>我的训练模板 <small>${state.plans.filter(p=>!p.archived).length} 个计划</small></h2><button class="primary" data-action="new-plan">＋ 新建计划</button></div><div class="plan-grid">${state.plans.filter(p=>!p.archived).map(p=>`<section class="card plan-card"><span class="tag">${esc(p.tag||'自定义训练')}</span><h3>${esc(p.name)}</h3><p>${p.exercises.length} 个动作 · ${p.exercises.reduce((a,e)=>a+e.sets,0)} 组</p><ul>${p.exercises.map(e=>`<li><button type="button" class="plan-guide-btn" data-guide="${esc(e.name)}" aria-label="查看${esc(e.name)}动作图解">${esc(e.name)}</button> <small style="float:right">${e.sets} × ${esc(e.repRange||e.reps)}</small></li>`).join('')}</ul><div style="display:flex;gap:10px"><button class="secondary" data-edit-plan="${p.id}">编辑计划</button><button class="secondary" data-start-plan="${p.id}">开始训练 ↗</button></div></section>`).join('')}</div>`}
function historyPage(){return `<div class="card"><div class="card-title"><h2>全部训练 <small>${state.logs.length} 次</small></h2><button class="text-btn" data-action="export">导出备份 ⇩</button></div>${state.logs.length?state.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="history-item"><div class="history-date">${esc(l.date.slice(0,7))}<br><b>${esc(l.date.slice(8))}</b></div><div><h3>${esc(l.name)}</h3><p>${completedSets(l).length} 组 · ${volume(l).toLocaleString()} kg 外部负重容量（不含辅助配重）${l.notes?' · '+esc(l.notes):''}</p></div><button class="text-btn" data-log="${l.id}">查看详情 →</button></div>`).join(''):`<div class="empty-state"><h3>第一篇训练日记，等你来写</h3><p>完成训练后，每一组的重量和次数都会保存到这里。</p><button class="primary" data-action="start">开始第一次训练</button></div>`}</div>`}
function progressPage(){const exercises=[...new Set([...state.plans.flatMap(p=>p.exercises.map(e=>e.name)),...state.logs.flatMap(l=>l.exercises.map(e=>e.name))])];return `<div class="card"><div class="card-title"><h2>动作力量趋势</h2><select class="filter" id="chart-exercise" aria-label="选择动作">${exercises.map(e=>`<option>${esc(e)}</option>`).join('')}</select></div><div id="strength-chart">${strengthChart(exercises[0])}</div></div><div class="card body-chart"><div class="card-title"><h2>体重记录 <small> / 按日期查看</small></h2><button class="primary" data-action="weight">＋ 记录体重</button></div>${state.weights.length?state.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="weight-row"><span>${esc(w.date)}</span><b>${w.kg} <small>kg</small></b><button class="text-btn delete" data-delete-weight="${w.id}">删除</button></div>`).join(''):`<div class="empty-state"><h3>变化，值得被记录</h3><p>添加体重记录，逐步建立你的身体档案。</p></div>`}</div>`}
function startWorkout(planId,date){if(state.draft){activeDraft=state.draft;navigate('session');toast('已恢复上次未完成的训练');return}modal('开始新的训练',`<label class="field">训练计划<select name="plan">${state.plans.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${p.id===planId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">训练日期<input type="date" name="date" value="${date||localDate()}" max="${localDate()}" required></label><p class="form-hint">重量按实际能力填写，哑铃按单只记录；辅助引体向上填写机器辅助配重，数字越大辅助越多。</p>`,fd=>{const p=state.plans.find(p=>p.id===fd.get('plan'));if(!p)return false;activeDraft={id:crypto.randomUUID(),phaseId:p.phaseId||null,name:p.name,date:fd.get('date'),notes:'',exercises:p.exercises.map(e=>({name:e.name,repRange:e.repRange||String(e.reps),loadType:isAssisted(e)?'assistance':'external',sets:Array.from({length:e.sets},()=>({kg:e.kg??null,reps:e.reps,done:false}))}))};state.draft=activeDraft;save();navigate('session')})}
function sessionPage(){activeDraft=state.draft;if(!activeDraft)return '<div class="empty-state">没有进行中的训练</div>';return `<section class="card"><div class="card-title"><h2>${esc(activeDraft.name)} <small>${esc(activeDraft.date)}</small></h2><button class="text-btn delete" data-action="discard">放弃草稿</button></div><div class="info-strip">填重量与次数，勾选已完成的组。</div>${activeDraft.exercises.map((e,ei)=>`<div class="session-exercise"><h3>${String(ei+1).padStart(2,'0')} <span style="color:#cbbfd4;margin:0 7px">/</span> ${esc(e.name)} <button type="button" class="guide-tip-btn" data-guide="${esc(e.name)}" aria-label="查看${esc(e.name)}动作图解">动作图解 ↗</button></h3><p class="form-hint">${esc(e.repRange?`目标 ${e.repRange} 次 · `:"")}${exerciseRestAdvice(e.name)}${isAssisted(e)?' · 填机器辅助配重，达标后减少辅助；不计入负重容量':''}</p><div class="set-row set-head"><span>组数</span><span>${isAssisted(e)?'辅助配重 / kg':'重量 / kg'}</span><span>次数</span><span>完成</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row ${s.done?'done':''}"><span style="color:#a899b6">${si+1}</span><input type="number" min="0" max="2000" step="0.25" value="${s.kg??''}" aria-label="${esc(e.name)}第${si+1}组${isAssisted(e)?'辅助配重':'重量'}" data-e="${ei}" data-s="${si}" data-field="kg"><input type="number" min="1" max="999" step="1" value="${s.reps}" aria-label="${esc(e.name)}第${si+1}组次数" data-e="${ei}" data-s="${si}" data-field="reps"><input type="checkbox" ${s.done?'checked':''} aria-label="完成${esc(e.name)}第${si+1}组" data-e="${ei}" data-s="${si}" data-field="done"><button class="remove-set" data-remove="${ei}:${si}" aria-label="删除此组">×</button></div>`).join('')}<button class="text-btn" data-add-set="${ei}">＋ 添加一组</button></div>`).join('')}<button class="secondary" data-action="add-exercise">＋ 添加动作</button><textarea class="session-note" id="session-note" placeholder="备注（选填）" aria-label="训练备注" maxlength="1000">${esc(activeDraft.notes)}</textarea><div class="session-summary"><span id="session-stats">${completedSets(activeDraft).length} 组已完成 · ${volume(activeDraft).toLocaleString()} kg 外部负重容量（不含辅助配重）</span><button class="primary" data-action="finish">完成并保存训练 ✓</button></div></section>`}
function editPlan(id){const p=state.plans.find(p=>p.id===id);modal(p?'编辑训练计划':'新建训练计划',`<label class="field">计划名称<input name="name" maxlength="35" value="${esc(p?.name||'')}" required></label><label class="field">训练部位<input name="tag" maxlength="40" value="${esc(p?.tag||'')}" placeholder="例如：胸 · 肩 · 三头"></label><label class="field">动作清单<textarea name="exercises" required placeholder="杠铃卧推, 4, 8, 40">${p?p.exercises.map(e=>`${e.name}, ${e.sets}, ${e.reps}, ${e.kg??0}`).join('\n'):''}</textarea></label><p class="form-hint">每行一个动作，格式：动作名称, 组数, 次数, 参考重量(kg)；辅助引体向上填写辅助配重<br>例如：杠铃卧推, 4, 8, 40</p>`,fd=>{const exercises=fd.get('exercises').split('\n').filter(l=>l.trim()).map(line=>{const [name,sets,reps,kg]=line.split(/[,，]/).map(x=>x.trim());const prior=p?.exercises.find(e=>e.name===name);return {...(prior?.reps===Number(reps)?prior:{}),name,sets:Number(sets),reps:Number(reps),kg:Number(kg)}});if(exercises.length>30||exercises.some(e=>!e.name||!Number.isInteger(e.sets)||e.sets<1||e.sets>20||!Number.isInteger(e.reps)||e.reps<1||e.reps>999||!Number.isFinite(e.kg)||e.kg<0||e.kg>2000)){toast('请检查格式：组数 1–20、次数 1–999、重量 0–2000');return false}const next={...(p||{}),id:p?.id||crypto.randomUUID(),name:fd.get('name').trim(),tag:fd.get('tag').trim(),exercises};if(!next.name){toast('请填写计划名称');return false}if(p)state.plans[state.plans.indexOf(p)]=next;else state.plans.push(next);save();render();toast('训练计划已保存')})}
function recordWeight(){modal('记录身体的变化',`<label class="field">日期<input type="date" name="date" value="${localDate()}" max="${localDate()}" required></label><label class="field">体重 / kg<input type="number" name="kg" min="20" max="500" step="0.1" required placeholder="例如 68.5"></label><p class="form-hint">同一天再次记录会更新当天体重。尽量保持相同的称重条件。</p>`,fd=>{const date=fd.get('date'),kg=Number(fd.get('kg'));const existing=state.weights.find(w=>w.date===date);if(existing)existing.kg=kg;else state.weights.push({id:crypto.randomUUID(),date,kg});save();render();toast('体重已记录')})}
function exportData(){const blob=new Blob([JSON.stringify({app:'jianqiang',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`渐强-训练备份-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('数据备份已导出')}
$('#backup').onclick=exportData;
function bind(){const actions={plans:()=>navigate('plans'),progress:()=>navigate('progress'),start:()=>startWorkout(),export:exportData,'selected-start':()=>startWorkout(state.schedule[selectedDay],selectedDate>localDate()?localDate():selectedDate),weight:recordWeight,'new-plan':()=>editPlan(),goal:()=>modal('设定每周目标',`<label class="field">每周训练次数<input type="number" name="goal" value="${state.goal}" min="1" max="14" step="1" required></label>`,fd=>{state.goal=Number(fd.get('goal'));save();render()}),discard:()=>modal('放弃这次训练？','<p class="form-hint">此操作会清除当前未完成的草稿，已保存的历史记录会保留。</p>',()=>{state.draft=null;activeDraft=null;save();navigate('dashboard')}),'add-exercise':()=>modal('添加训练动作','<label class="field">动作名称<input name="name" maxlength="50" required></label>',fd=>{const name=fd.get('name').trim();if(!name)return false;activeDraft.exercises.push({name,sets:[{kg:0,reps:10,done:false}]});save();render()}),finish:()=>{if(!completedSets(activeDraft).length){toast('先完成并勾选至少一组，再保存训练');return}if(completedSets(activeDraft).some(s=>s.kg===null||!Number.isFinite(s.kg)||s.kg<0||s.kg>2000||!Number.isInteger(s.reps)||s.reps<1||s.reps>999)||$$('.set-row.done input').some(i=>!i.checkValidity())){toast('请检查重量和次数的有效范围');return}state.logs.push(structuredClone(activeDraft));state.draft=null;activeDraft=null;save();navigate('history');toast('训练已保存。又向前迈进了一步！')}};$$('[data-action]').forEach(b=>b.onclick=()=>actions[b.dataset.action]?.());$$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;selectedDay=Number(b.dataset.day);render()});$$('[data-edit-plan]').forEach(b=>b.onclick=()=>editPlan(b.dataset.editPlan));$$('[data-start-plan]').forEach(b=>b.onclick=()=>startWorkout(b.dataset.startPlan));$$('[data-schedule]').forEach(b=>b.onclick=()=>{const day=b.dataset.schedule;modal('安排周'+ '日一二三四五六'[day],`<label class="field">训练计划<select name="plan"><option value="">休息日</option><option value="recovery" ${state.schedule[day]==='recovery'?'selected':''}>轻活动 · 恢复</option>${state.plans.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${p.id===state.schedule[day]?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`,fd=>{state.schedule[day]=fd.get('plan');save();render()})});$$('[data-delete-weight]').forEach(b=>b.onclick=()=>modal('删除这条体重记录？','<p class="form-hint">删除后不能撤销。建议先导出备份。</p>',()=>{state.deletedWeightIds=[...new Set([...(state.deletedWeightIds||[]),b.dataset.deleteWeight])];state.weights=state.weights.filter(w=>w.id!==b.dataset.deleteWeight);save();render()}));$$('[data-log]').forEach(b=>b.onclick=()=>{const l=state.logs.find(l=>l.id===b.dataset.log);modal(l.name,`<p class="form-hint">${esc(l.date)} · ${volume(l).toLocaleString()} kg 外部负重容量（不含辅助配重）</p>${l.exercises.map(e=>`<h3 style="font-size:13px">${esc(e.name)} <button type="button" class="guide-tip-btn" data-guide="${esc(e.name)}" aria-label="查看${esc(e.name)}动作图解">动作图解 ↗</button></h3>${e.sets.filter(s=>s.done).map((s,i)=>`<div class="weight-row"><small>第 ${i+1} 组</small><span>${isAssisted(e)?'辅助 ':''}${s.kg} kg × ${s.reps} 次</span></div>`).join('')}`).join('')}<p class="form-hint">${esc(l.notes)}</p>`,()=>{});$('#modal-form button[type=submit]').textContent='完成'});if($('#chart-exercise'))$('#chart-exercise').onchange=e=>$('#strength-chart').innerHTML=strengthChart(e.target.value);if(page==='session'){ $$('[data-field]').forEach(i=>i.oninput=()=>{if(!i.checkValidity())return;const s=activeDraft.exercises[i.dataset.e].sets[i.dataset.s];s[i.dataset.field]=i.dataset.field==='done'?i.checked:(i.value===''?null:Number(i.value));i.closest('.set-row').classList.toggle('done',s.done);save();$('#session-stats').textContent=`${completedSets(activeDraft).length} 组已完成 · ${volume(activeDraft).toLocaleString()} kg 外部负重容量（不含辅助配重）`});$$('[data-add-set]').forEach(b=>b.onclick=()=>{const sets=activeDraft.exercises[b.dataset.addSet].sets;sets.push({...sets.at(-1)||{kg:0,reps:10},done:false});save();render()});$$('[data-remove]').forEach(b=>b.onclick=()=>{const [ei,si]=b.dataset.remove.split(':');activeDraft.exercises[ei].sets.splice(Number(si),1);save();render()});$('#session-note').oninput=e=>{activeDraft.notes=e.target.value;save()}}$('#modal-form button[type=submit]').textContent='保存';}
let cloudReady=false,cloudPending=true,localRevision=0,cloudTimer=null,cloudQueue=Promise.resolve(),lastCloudCounts=null;
function setSyncStatus(text){const el=$('#sync-status');if(el)el.textContent='◈ '+text}
function syncError(error){return error?.name==='AbortError'?'云端连接超时':error?.message?.startsWith('HTTP ')?error.message:'无法连接云端（网络或跨站请求受限）'}
function cloudCounts(value){return `${value.logs?.length||0} 条训练 / ${value.weights?.length||0} 条体重${value.draft?' / 有草稿':''}`}
function syncSummary(){return '已确认同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · '+cloudCounts(state)}
function reportSyncFailure(error){cloudPending=true;setSyncStatus('上传未确认 · 本机数据保留 · 点击重试');$('#sync-status').title=syncError(error)+'；本机 '+cloudCounts(state)+(lastCloudCounts?'；上次云端 '+lastCloudCounts:'');}
function mergeCloudState(cloud,local){return {...initial(),...mergeTrainingState(cloud,local)}}
async function readCloud(){
 const res=await apiFetch('/api/state',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status+' · 云端读取失败');
 const data=await res.json();canManageDevices=data.canManageDevices===true;
 if(data.state){lastCloudCounts=cloudCounts(data.state);const local=hasLocalState?state:null;state=mergeCloudState(data.state,local);if(local&&JSON.stringify(state)!==JSON.stringify(data.state))cloudPending=true;}
 if(typeof applyRequestedProgression==='function')applyRequestedProgression();
 syncBaseline=structuredClone(state);state.deletedWeightIds=state.deletedWeightIds||[];hasLocalState=true;persistLocal();cloudReady=true;
 if(state.draft)activeDraft=state.draft;
 if(page!=='session')render();
}
async function connectCloud(){setSyncStatus('连接云端中 · 本机记录保留');try{
 if(new URLSearchParams(location.hash.slice(1)).has('pair'))history.replaceState(null,'',location.pathname+location.search);
 await readCloud();queueCloudSave();
 }catch(error){cloudReady=false;reportSyncFailure(error)}}
async function pushCloudState(){
 const revision=localRevision;
 const res=await apiFetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})});
 if(!res.ok)throw new Error('HTTP '+res.status+' · 云端上传失败');
 const data=await res.json();if(!data.state)throw new Error('云端未返回保存结果');
 state=mergeCloudState(data.state,state);lastCloudCounts=cloudCounts(data.state);if(activeDraft&&state.draft)activeDraft=state.draft;
 cloudPending=localRevision!==revision;syncBaseline=structuredClone(state);persistLocal();
 setSyncStatus(cloudPending?'本机有新修改 · 等待上传':syncSummary());
 $('#sync-status').title='云端已确认：'+lastCloudCounts+'；点击立即同步';
 if(page!=='session')render();if(cloudPending)queueCloudSave();
}
function queueCloudSave(){if(!cloudReady||!canEdit)return;setSyncStatus('等待上传确认 · '+cloudCounts(state));clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{cloudQueue=cloudQueue.then(pushCloudState).catch(reportSyncFailure)},600)}
async function refreshCloud(){if(page==='session'&&cloudReady){if(cloudPending)queueCloudSave();return}if(!cloudReady){await connectCloud();return}try{
 await readCloud();if(cloudPending)queueCloudSave();else setSyncStatus(syncSummary());
 }catch(error){cloudReady=false;reportSyncFailure(error)}}
async function syncNow(){clearTimeout(cloudTimer);setSyncStatus('正在同步 · 请保持页面打开');cloudQueue=cloudQueue.then(async()=>{
 await readCloud();await pushCloudState();toast(cloudPending?'还有新修改，正在继续同步':'云端已确认保存：'+lastCloudCounts);

function trainingEvidencePanel(){return `<section class="training-evidence"><h3>有强度，也有明确的加重标准</h3><p>RIR 2 表示还能规范完成约 2 次。主要动作先从 RIR 2 开始，熟悉后保持 RIR 1–2；新动作首轮 RIR 2–3。辅助动作最后一组可接近 RIR 1，不要求力竭、借力或强迫次数。</p><p>先增加次数：例如推胸 3×6–10，逐次把三组推进到 10、10、10；末组仍有 1–2 次余力，连续两次稳定，再加最小档位（优先约 2–5%），次数回到范围下端。加重后低于下限或动作变形，减回一档。</p><p><b>辅助引体向上 3×6–10：</b>45 kg 是机器提供的辅助，不是外挂负重。先在同一机器逐步增加规范次数；连续两次三组均达到 10 次、末组仍留 1–2 次余力，再减少最小辅助档位。做不到 6 次时增加辅助。辅助配重不计入外部负重容量，曲线仅比较同一机器的辅助值；次数和动作质量也要一起看。</p><p>推胸、辅助引体向上、划船、腿举、硬拉组间休息 2–3 分钟；呼吸或表现未恢复可延长至 4 分钟。侧平举、反向飞鸟、弯举、下压、腿弯举、腿屈伸、提踵休息 90–120 秒。主要动作先逐级热身 2–3 组，热身不计正式组。</p><p>试行两周；连续两次同一动作明显退步、酸痛影响下次动作或睡眠变差，先增加一天休息，必要时一周内正式组减少约三分之一到一半并保留 3–4 次余力。关节疼痛时停止该动作，调整或替换。</p><details><summary>资料与个体化依据 · 2026-10-28 核对</summary><p><a href="https://acsm.org/resistance-training-guidelines-update-2026/" target="_blank" rel="noreferrer">ACSM 2026 指南更新</a>及<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12965823/" target="_blank" rel="noreferrer">正式立场声明全文</a>：个体化负荷、训练持续性与足够周总量重要；力竭不是必要条件。增肌可从每肌群每周约 10 组附近调整，但不是每个人起步必须达到的硬性门槛。</p><p>本计划每周五次跨周轮换，各部位平均约 1.67 次/周；推日胸部 6 直接组、拉日背部 6 直接组，平均约 10 组/周；腿日前侧 5 组、腿后侧 6 组。复合动作同时刺激手臂和臀部，不把间接刺激简单算成完整直接组。每动作 2–3 组、次数范围、RIR、两次达标再加重和疲劳调整是结合现有 4 次训练经历制定的实操方案，不是指南规定的唯一组合。</p><p>推胸 35 kg、上斜哑铃单只 15 kg、坐姿划船 25 kg（10 月 21 日记录；10 月 28 日龙门架直杆划船为临时替代，单独记录）、腿举 60 kg、下压 15 kg 仅来自历史记录，不代表已验证今天能完成。器械更换后重新选重；硬拉旧记录的单只/总重口径不明，留空重选；新动作也留空。每周记录体重、训练表现与恢复，先确保规律饮食、足够蛋白质和睡眠。</p></details></section>`}
function trainingReviewPanel(){return `<section class="training-evidence"><h3>推 → 拉 → 腿，跨周继续</h3><p>常规周一、二、四、五、六力量，周三、日恢复；跨周不重置部位。2026-10-28 拉、10-29 腿、10-30 恢复、10-31 推、11-01 恢复；下一周 11-02 拉、11-03 腿、11-05 推、11-06 拉、11-07 腿。日期是计划，不代表已完成。</p><p>推：胸、肩中束、三头；拉：背、肩后束、二头；腿：股四头、臀、腘绳肌、小腿。漏练时继续顺序并调整日历，不在同一天补两次。若五练影响恢复，先插入休息日，保留训练顺序。</p></section>`}

  if(type==='bridge'){const hip=end?[132,142]:[132,169];art=bench('38,187 222,187')+head(48,156)+poly(`65,167 ${hip} 182,124 211,176`)+poly('71,169 102,178', '#b9a7d1',6)+line([199,179],[220,179],'#655277',5)+arrow(139,165,0,-26)}
  else if(type==='hinge'){art=head(...(end?[173,100]:[120,46]))+line(end?[157,114]:[120,65],end?[103,134]:[120,119],'#8671b7',14)+poly(end?'103,134 122,153 120,185':'120,119 120,151 120,185')+poly(end?'157,114 146,142 137,164':'120,68 137,100 139,131','#b49dce',7)+weight(end?137:139,end?166:134)+line([112,186],[140,186],'#655277',5)+arrow(96,111,-24,13)}
  else if(type==='squat'){let h=end?[109,84]:[118,48],shoulder=end?[115,103]:[120,67],hip=end?[88,144]:[120,118],knee=end?[139,146]:[119,149],foot=[120,185];art=head(...h)+line(shoulder,hip,'#8671b7',14)+poly(`${hip} ${knee} ${foot}`)+line([114,186],[139,186],'#655277',5)+poly(`${shoulder} ${end?'139,120 137,103':'144,87 138,74'}`,'#b49bcf',7)+weight(end?138:139,end?100:73)+arrow(63,109,0,43)}
  else if(type==='legpress'){const knee=end?[142,120]:[115,116],foot=end?[189,94]:[151,99];art=bench('49,105 76,160 113,160')+head(60,92)+line([70,110],[92,149],'#8671b7',14)+poly(`92,149 ${knee} ${foot}`)+bench(`${foot[0]-5},${foot[1]-15} ${foot[0]+8},${foot[1]+12}`)+poly('72,151 86,140 102,151','#baa7d0',6)+arrow(160,133,25,-23)}
  else if(type==='incline'){art=bench('49,106 110,159 149,159')+head(57,85)+line([72,105],[112,147],'#8671b7',14)+poly('112,147 163,150 177,183')+line([173,184],[194,184],'#655277',5)+poly(end?'74,108 97,82 110,52':'74,108 114,119 118,87','#b59dd0',8)+weight(end?110:118,end?51:85)+arrow(145,107,0,-40)}
  else if(type==='lateral'){art=head(130,45)+line([130,64],[130,120],'#8671b7',16)+poly('130,120 114,182')+poly('130,120 146,182')+poly(end?'126,70 99,82 66,88':'126,70 106,112 100,144','#b29bcc',7)+poly(end?'134,70 161,82 194,88':'134,70 154,112 160,144','#b29bcc',7)+weight(end?65:100,end?88:144)+weight(end?195:160,end?88:144)+arrow(184,136,15,-28)}
  else if(type==='calf'){const up=end?11:0;art=bench('191,67 191,186')+head(121,45-up)+line([121,64-up],[121,120-up],'#8671b7',14)+poly(`121,120 121,${156-up} 121,${183-up}`)+poly(`121,${72-up} 151,${88-up} 189,83`,'#b49dcd',7)+poly(end?'121,173 138,185':'120,185 140,185','#655277',5)+arrow(81,175,0,-27)}
  else if(type==='assisted'){const h=end?37:79,y=end?56:98;art=bench('45,185 45,35 215,35 215,185')+line([85,35],[175,35],'#655277',5)+head(130,h)+line([130,y],[130,y+44],'#8671b7',14)+poly(`130,${y} 102,${end?77:65} 88,35`,'#b49dcf',7)+poly(`130,${y} 158,${end?77:65} 172,35`,'#b49dcf',7)+poly(`130,${y+44} 146,${y+64} 118,${y+67}`)+bench(`103,${y+72} 157,${y+72}`)+arrow(191,133,0,-32)}
  else if(type==='pulldown'){art=bench('77,150 145,150')+bench('170,183 170,32 104,32')+head(106,75)+line([108,94],[112,140],'#8671b7',14)+poly('112,141 143,143 153,183')+poly(end?'106,95 80,102 91,110':'106,95 85,68 92,41','#b49dcf',7)+poly(end?'110,95 137,104 130,110':'110,95 139,68 129,41','#b49dcf',7)+line([89,end?109:40],[133,end?109:40],'#655277',5)+line([110,32],[110,end?109:40],'#ccc2da',2)+bench('114,137 143,137')+arrow(59,56,0,38)}
  else if(type==='row'){const hand=end?[131,119]:[188,109];art=bench('62,151 117,151')+bench('176,153 186,140')+head(94,66)+line([97,85],[105,140],'#8671b7',14)+poly('105,140 146,134 178,147')+poly(end?'100,91 88,115 131,119':'100,91 143,100 188,109','#b49dce',7)+line(hand,[220,120],'#ccc2da',2)+line([hand[0],hand[1]-7],[hand[0],hand[1]+7],'#655277',5)+arrow(183,84,-40,0)}
  else if(type==='legcurl'){art=bench('70,89 81,150 143,150')+head(83,68)+line([85,88],[100,142],'#8671b7',14)+poly(end?'100,142 149,140 137,181':'100,142 149,140 200,143')+bench('122,130 148,130')+poly('87,100 104,122 114,143','#b49dce',7)+joint(149,140)+weight(end?137:197,end?178:146)+arrow(202,157,-13,27)}
  else if(type==='press'){art=bench('79,92 79,150 121,150')+head(96,65)+line([96,84],[96,140],'#8671b7',14)+poly('96,141 143,141 155,182')+poly(end?'99,91 145,99 188,98':'99,91 112,114 137,92','#b49dce',8)+line([end?188:137,86],[end?188:137,107],'#655277',5)+arrow(152,71,37,0)}
  else {const push=type==='pushdown',hand=push?(end?[145,143]:[166,98]):(end?[159,86]:[145,147]);art=head(122,45)+line([122,64],[122,120],'#8671b7',14)+poly('122,120 110,183')+poly('122,120 144,183')+poly(`125,73 143,105 ${hand}`,'#b49dcf',7)+joint(143,105);if(push)art+=bench('204,184 204,27 175,27')+line([175,27],hand,'#ccc2da',2)+line([hand[0]-5,hand[1]],[hand[0]+6,hand[1]+5],'#655277',6)+arrow(181,110,0,32);else art+=weight(...hand)+arrow(189,135,0,-33)}
  return `<g transform="translate(${end?285:0},0)"><rect x="8" y="8" width="258" height="231" rx="14" fill="${end?'#f1ebf9':'#f6f3f9'}"/><text x="25" y="31" font-size="10" fill="#aa97bd">${type==='hinge'?(end?'02 · 下放：向后推髋':'01 · 站立：微屈膝'):(end?'02 · 发力位置':'01 · 准备位置')}</text><g transform="translate(0,7)">${art}</g><path d="M34,200 H241" stroke="#e5ddec"/><text x="137" y="221" text-anchor="middle" font-size="11" fill="#8c769e">${esc(labels[end?1:0])}</text></g>`;
 }
 return `<svg class="motion-figure" viewBox="0 0 560 248" role="img" aria-label="${esc(name)}准备与发力位置示意：${esc(labels.join('；'))}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="${sid}" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#a797c2" stroke-width="1.3"/></marker></defs>${frame(false)}${frame(true)}</svg>`
}
const guideDialog=document.createElement('dialog');guideDialog.id='exercise-dialog';guideDialog.setAttribute('aria-label','动作图解与教程');document.body.appendChild(guideDialog);
let guideFromLibrary=false;
function guideFrame(title,body,back=false){guideDialog.innerHTML=`<div class="guide-top"><div><div class="eyebrow">MOVE WITH CONFIDENCE</div><h2>${esc(title)}</h2></div><div>${back?'<button class="text-btn" id="guide-back">← 动作库</button>':''}<button class="icon-btn" id="guide-close" aria-label="关闭动作指南">×</button></div></div>${body}`;guideDialog.querySelector('#guide-close').onclick=()=>guideDialog.close();if(back)guideDialog.querySelector('#guide-back').onclick=showGuideLibrary;if(!guideDialog.open)guideDialog.showModal();guideDialog.scrollTop=0;}
function showExerciseGuide(name,fromLibrary=false){guideFromLibrary=fromLibrary;const g=exerciseGuides[name];if(!g){guideFrame(name,`<div class="empty-state"><h3>这个自定义动作还没有专属图解</h3><p>先确认具体动作与器械，再向教练学习。</p><a class="primary" href="https://search.bilibili.com/all?keyword=${encodeURIComponent(name+' 动作 教学')}" target="_blank" rel="noopener noreferrer">在 B 站搜索教学 ↗</a></div>`,fromLibrary);return}guideFrame(name,`<div class="guide-tags"><span class="tag">${g.group}</span><span>${g.equipment}</span></div><p class="guide-brief">${g.brief}</p><figure class="guide-figure">${motionDiagram(g.type,name,g.labels)}<figcaption>动作路径示意 · 不代表唯一角度或动作幅度，以器械和自身舒适度为准。</figcaption></figure>${g.type==='hinge'?'<div class="hinge-cues"><p><b>① 准备</b><br>双脚踩稳 · 腹部收紧 · 膝盖微屈</p><p><b>② 下放</b><br>臀部后移 · 背部自然 · 哑铃沿腿下降</p><p><b>③ 站起</b><br>伸髋站直 · 不后仰顶腰 · 无需碰地</p></div>':''}<div class="guide-columns"><section><h3>先调整到位</h3><p>${g.setup}</p><h3>一组动作，记住这三步</h3><ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol></section><section class="guide-errors"><h3>留意这些常见错误</h3><ul>${g.errors.map(s=>`<li>${s}</li>`).join('')}</ul><div class="guide-restart"><b>重新开练时</b><p>先用很轻的阻力熟悉轨迹，按当前阶段保留余力，不照视频里的重量训练。出现锐痛或关节痛时停止该动作。</p></div></section></div><section class="guide-resource"><div><h3>想看完整示范？</h3><p>${g.source}</p></div><a class="primary" href="${g.url}" target="_blank" rel="noopener noreferrer">打开详细教程 ↗</a></section>${g.extraVideo?`<section class="guide-resource"><div><h3>补充：髋铰链与硬拉原理</h3><p>凯圣王 · 罗马尼亚硬拉详解（约 11 分 31 秒，含杠铃示范）</p></div><a class="primary" href="${g.extraVideo}" target="_blank" rel="noopener noreferrer">打开补充视频 ↗</a></section>`:''}<div class="guide-resource-note">优先选用 B 站中文教程；实际播放可能受网络、登录和客户端限制。<a href="https://search.bilibili.com/all?keyword=${encodeURIComponent(name+' 动作 教学')}" target="_blank" rel="noopener noreferrer">找其他 B 站教程 ↗</a>${g.basis?` · <a href="${g.basis}" target="_blank" rel="noopener noreferrer">补充技术参考（英文）↗</a>`:''}</div>`,fromLibrary)}
function showGuideLibrary(){guideFrame('动作图解库',`<p class="guide-library-intro">${Object.keys(exerciseGuides).length} 个动作 · 先看图解，再记录每一组。</p><label class="guide-search">⌕ <input id="guide-search" type="search" placeholder="搜索动作或部位，例如：臀、背、划船" aria-label="搜索动作或部位"></label><div id="guide-library-results"></div>`);const result=guideDialog.querySelector('#guide-library-results');function draw(term=''){const entries=Object.entries(exerciseGuides).filter(([name,g])=>(name+g.group+g.equipment).includes(term.trim()));result.innerHTML=entries.length?`<div class="guide-library-grid">${entries.map(([name,g])=>`<button class="guide-library-card" data-library-guide="${name}"><div class="guide-thumbnail">${motionDiagram(g.type,name,g.labels)}</div><div><span class="tag">${g.group}</span><h3>${name}<span>↗</span></h3><p>${g.brief}</p></div></button>`).join('')}</div>`:'<div class="empty-state">没有找到匹配动作，试试动作名称或训练部位。</div>';result.querySelectorAll('[data-library-guide]').forEach(b=>b.onclick=()=>showExerciseGuide(b.dataset.libraryGuide,true))}draw();guideDialog.querySelector('#guide-search').oninput=e=>draw(e.target.value)}
const libraryButton=document.createElement('button');libraryButton.innerHTML='<span>▧</span>动作图解';libraryButton.onclick=showGuideLibrary;document.querySelector('nav').appendChild(libraryButton);
document.addEventListener('click',e=>{const button=e.target.closest('[data-guide]');if(button)showExerciseGuide(button.dataset.guide)});render();
</script></body></html>
